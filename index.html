---
layout: null
---
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#0366d6">
  <meta name="mobile-web-app-capable" content="yes">
  <style>
    body { font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; max-width: 720px; margin: 0 auto; padding: 24px; line-height: 1.7; background: #fff; color: #222; }
    h1 { border-bottom: 2px solid #333; padding-bottom: 8px; }
    /* 카테고리 탭 */
    .cats { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
    .cat-btn {
      background: #f0f0f0; border: 1px solid #ddd; border-radius: 20px;
      padding: 6px 16px; font-size: 14px; cursor: pointer; color: #333;
    }
    .cat-btn.active { background: #0366d6; color: #fff; border-color: #0366d6; }
    /* 글 목록 */
    .post { margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
    .post h2 { margin-bottom: 4px; }
    .post .date { color: #888; font-size: 14px; }
    .post .cat-tag {
      display: inline-block; background: #e8f0fe; color: #0366d6;
      border-radius: 10px; font-size: 12px; padding: 1px 10px; margin-left: 6px;
    }
    .post .excerpt { margin-top: 8px; }
    a { color: #0366d6; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .empty { color: #888; text-align: center; padding: 40px 0; }
  </style>
</head>
<body>
  <h1>{{ site.title }}</h1>
  <p>{{ site.description }}</p>

  <div class="cats">
    <button class="cat-btn active" data-cat="all">전체</button>
    <button class="cat-btn" data-cat="ai">🤖 AI</button>
    <button class="cat-btn" data-cat="육아">👶 육아</button>
    <button class="cat-btn" data-cat="기계">⚙️ 기계</button>
    <button class="cat-btn" data-cat="정치">🏛️ 정치</button>
  </div>

  <div id="postList">
    {% for post in site.posts %}
    <div class="post" data-cats="{{ post.categories | join: ',' }}">
      <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
      <div class="date">{{ post.date | date: "%Y년 %m월 %d일" }}
        {% for c in post.categories %}<span class="cat-tag">{{ c }}</span>{% endfor %}
      </div>
      <div class="excerpt">{{ post.excerpt | strip_html | truncatewords: 40 }}</div>
    </div>
    {% endfor %}
  </div>
  <div class="empty" id="emptyMsg" style="display:none">이 게시판에 글이 없습니다.</div>

<script>
  const btns = document.querySelectorAll('.cat-btn');
  const posts = document.querySelectorAll('#postList .post');
  const emptyMsg = document.getElementById('emptyMsg');
  btns.forEach(btn => {
    btn.addEventListener('click', () => {
      btns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const cat = btn.dataset.cat;
      let visible = 0;
      posts.forEach(p => {
        const cats = (p.dataset.cats || '').split(',');
        const show = cat === 'all' || cats.includes(cat);
        p.style.display = show ? '' : 'none';
        if (show) visible++;
      });
      emptyMsg.style.display = visible === 0 ? 'block' : 'none';
    });
  });
</script>
</body>
</html>
